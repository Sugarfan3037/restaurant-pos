spring.application.name=restaurant-pos
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_pos?serverTimezone=Asia/Taipei&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-before-production}
jwt.expiration=${JWT_EXPIRATION:86400000}
